server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-admin routes on the fragment, so only index.html is ever requested.
    # The fallback keeps a reload working should the router move to history mode.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Carries the asset hashes, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
